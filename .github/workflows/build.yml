name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Topic branches build once, through their PR. A newer push supersedes a run still in
# progress, except on master where a cancelled run could stop halfway through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  Configuration: Release
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  ACT:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 1
          SA_PASSWORD: P@ssw0rd
        ports:
          - 31433:1433
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: npgsql_tests
          POSTGRES_PASSWORD: npgsql_tests
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a health check
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    defaults:
      run:
        shell: bash

    steps:
      - name: "Determine prerequisites"
        id: prereq
        run: |
          echo "need_node=$(command -v node >/dev/null 2>&1 && echo 0 || echo 1)" >> $GITHUB_OUTPUT
          echo "need_yarn=$(command -v yarn >/dev/null 2>&1 && echo 0 || echo 1)" >> $GITHUB_OUTPUT

      # Consider switching to https://github.com/actions/setup-node when it works
      # https://github.com/nektos/act/issues/973
      - name: Install node
        if: ${{ steps.prereq.outputs.need_node == '1' }}
        run: |
          if [ "${RUNNER_OS,,}" = "windows" ]
          then
            choco install nodejs -y
            echo "C:\Program Files\nodejs" >> $GITHUB_PATH
          else
            curl -sS https://webi.sh/node | sh
            echo ~/.local/opt/node/bin >> $GITHUB_PATH
          fi

      - name: Install yarn
        if: ${{ steps.prereq.outputs.need_yarn == '1' }}
        run: |
          if [ "${RUNNER_OS,,}" = "windows" ]
          then
            choco install yarn -y
            echo "C:\Program Files (x86)\Yarn\bin" >> $GITHUB_PATH
          else
            npm install -g yarn
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - run: yarn install

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - uses: dotnet/nbgv@master
        id: nbgv
        with:
          setAllVars: true

      - run: nbgv cloud

      - name: "Run pre-commit hooks"
        shell: bash
        run: sh $(git config core.hooksPath)/pre-commit normal

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        env:
          Zomp_EF_Data__SqlServerConnectionString: Server=localhost,31433;Database={0};User ID=sa;Password=P@ssw0rd;MultipleActiveResultSets=true;Connect Timeout=30;TrustServerCertificate=True;
        # dotnet test runs TUnit on Microsoft.Testing.Platform (see global.json), and coverage comes from
        # the extension TUnit brings. One run per project: the .NET 10 SDK gives every project of a
        # solution run the same results folder, where each coverage file overwrites the one before.
        # Every suite runs even when one fails, and the step fails at the end.
        run: |
          status=0
          for project in tests/*.Tests; do
            dotnet test --project "$project" -c Release --no-build \
              --results-directory "TestResults/$(basename "$project")" \
              --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml \
              --coverage-settings tests/CodeCoverage.config || status=1
          done
          exit $status
      - name: Generate code coverage report
        run: dotnet dnx --yes dotnet-reportgenerator-globaltool -reports:**/coverage.cobertura.xml -targetdir:./reports/coverage
      - name: Upload artifacts (code coverage)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/coverage
      - name: Pack
        run: dotnet pack --property:PackageOutputPath=${GITHUB_WORKSPACE}/packages --no-build
      - name: Upload artifacts (.nupkg)
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/

  sign:
    needs: build
    # Skip for outside contributors: fork PRs have no access to signing/publish
    # secrets, so the release pipeline can't do anything useful for them.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Download Package artifact
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNER_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNER_CLIENT_ID }}
        if: ${{ env.AZURE_CLIENT_SECRET != '' && github.ref == 'refs/heads/master' }}

        # --trust-signing-root is required on Linux: Trusted Signing issues from a root
        # Linux trust stores do not carry, and NuGet refuses to sign against a chain it
        # cannot build. Without it this fails with only "Certificate chain validation failed".
        run: |
          dotnet dnx SignUniversal.Cli@1.0.32 --yes sign packages/*.nupkg             --trust-signing-root             --trusted-signing-endpoint "${{ secrets.TRUSTED_SIGNING_ENDPOINT }}"             --trusted-signing-account "${{ secrets.TRUSTED_SIGNING_ACCOUNT }}"             --trusted-signing-certificate-profile "${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}"

      # Catches a signing step that quietly produced nothing usable, before anything is
      # pushed. A real Trusted Signing certificate chains to a root in NuGet's own bundle,
      # so anything short of a clean pass means nobody downstream could validate it either.
      - name: Verify signature
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNER_CLIENT_SECRET }}
        if: ${{ env.AZURE_CLIENT_SECRET != '' && github.ref == 'refs/heads/master' }}
        run: dotnet nuget verify packages/*.nupkg --all

      - name: Upload artifacts (.nupkg)
        uses: actions/upload-artifact@v4
        with:
          name: packages-signed
          path: packages/
          retention-days: 5

  publish:
    needs: sign
    # Skip for outside contributors: fork PRs have no access to signing/publish
    # secrets, so the release pipeline can't do anything useful for them.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the tag and GitHub Release
    defaults:
      run:
        shell: bash

    steps:
      - name: Download Package artifact
        uses: actions/download-artifact@v4
        with:
          name: packages-signed
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Push to MyGet
        if: ${{ env.MYGET_PUSH_KEY != '' }}
        run: dotnet nuget push packages/*.nupkg -s https://www.myget.org/F/zomp-efcore-extensions/api/v3/index.json -k ${{ secrets.MYGET_PUSH_KEY }}
        env:
          MYGET_PUSH_KEY: ${{ secrets.MYGET_PUSH_KEY }}

      - name: Push to NuGet
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        run: dotnet nuget push packages/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_PUSH_KEY }}

      # Every package shares one version, so it is read off the base package. The digit in
      # the pattern keeps Zomp.EFCore.WindowFunctions.SqlServer and its siblings out.
      - name: Determine version
        id: version
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        run: |
          pkg=$(basename "$(ls packages/Zomp.EFCore.WindowFunctions.[0-9]*.nupkg | head -1)" .nupkg)
          echo "version=${pkg#Zomp.EFCore.WindowFunctions.}" >> "$GITHUB_OUTPUT"

      # Prepared but not announced. NuGet has accepted the upload at this point and nothing
      # more; it still validates the signature and scans the package, and a package whose
      # certificate is not registered with the account is rejected at that stage. Announcing a
      # version which turns out to be uninstallable is worse than announcing it a few minutes
      # later, and building the release now means a slow validation costs a single command
      # rather than reconstructing the notes and assets by hand.
      - name: Draft GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # gh infers the repo from this when no checkout is present
        run: |
          gh release create "v${{ steps.version.outputs.version }}"             --draft             --target "$GITHUB_SHA"             --title "v${{ steps.version.outputs.version }}"             --generate-notes             packages/*.nupkg

      - name: Wait for NuGet to finish validating
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        run: |
          version="${{ steps.version.outputs.version }}"

          for _ in $(seq 1 40); do
            pending=""
            for file in packages/*.nupkg; do
              id=$(basename "$file" ".$version.nupkg")
              index="https://api.nuget.org/v3-flatcontainer/$(echo "$id" | tr '[:upper:]' '[:lower:]')/index.json"
              curl -s "$index" | grep -q "\"$version\"" || pending="$pending $id"
            done

            if [ -z "$pending" ]; then
              echo "$version of every package is available on NuGet"
              exit 0
            fi

            echo "Waiting for:$pending"
            sleep 30
          done

          echo "::error::$version was accepted by NuGet but these packages have not become available within 20 minutes:$pending. The release is drafted and can be published once they appear."
          exit 1

      # The packages are installable, so the release can be announced. This is also what
      # creates the tag, which a draft release holds but does not push.
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false
